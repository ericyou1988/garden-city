<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天气应用 — Garden City Demo</title>
  <style>
    /* ========== CSS 变量与重置 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: rgba(255, 255, 255, 0.15);
      --card-border: rgba(255, 255, 255, 0.2);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.8);
      --text-muted: rgba(255, 255, 255, 0.6);
      --input-bg: rgba(255, 255, 255, 0.2);
      --input-border: rgba(255, 255, 255, 0.3);
      --shadow: rgba(0, 0, 0, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-primary);
      transition: background 1s ease;
      overflow-x: hidden;
    }

    /* ========== 动态背景粒子 ========== */
    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ========== 主容器 ========== */
    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* 返回链接 */
    .back-link {
      align-self: flex-start;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }

    /* ========== 搜索区域 ========== */
    .search-area {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .search-area input {
      flex: 1;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      backdrop-filter: blur(10px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-area input::placeholder { color: var(--text-muted); }
    .search-area input:focus {
      border-color: rgba(255,255,255,0.5);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
    }

    .search-area button {
      padding: 12px 20px;
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .search-area button:hover { background: rgba(255,255,255,0.35); }
    .search-area button:active { transform: scale(0.97); }

    /* ========== 天气卡片 ========== */
    .weather-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px var(--shadow);
      text-align: center;
      display: none;
    }
    .weather-card.visible { display: block; }

    .weather-card .location {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .weather-card .date {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .weather-icon {
      font-size: 4rem;
      line-height: 1;
    }
    .temperature {
      font-size: 4rem;
      font-weight: 200;
      line-height: 1;
    }
    .temperature .unit {
      font-size: 1.5rem;
      vertical-align: super;
      font-weight: 400;
    }

    .weather-description {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* 详细信息网格 */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .detail-item {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .detail-item .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .detail-item .value {
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* ========== 每小时预报 ========== */
    .hourly-section {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px var(--shadow);
      display: none;
    }
    .hourly-section.visible { display: block; }

    .hourly-section h3 {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .hourly-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .hourly-scroll::-webkit-scrollbar { height: 4px; }
    .hourly-scroll::-webkit-scrollbar-track { background: transparent; }
    .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    .hourly-item {
      flex-shrink: 0;
      text-align: center;
      padding: 10px 14px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      min-width: 70px;
    }
    .hourly-item .time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .hourly-item .h-icon {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }
    .hourly-item .h-temp {
      font-size: 1rem;
      font-weight: 600;
    }

    /* ========== 7天预报 ========== */
    .forecast-section {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px var(--shadow);
      display: none;
    }
    .forecast-section.visible { display: block; }

    .forecast-section h3 {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .forecast-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .forecast-item:last-child { border-bottom: none; }

    .forecast-day {
      width: 80px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .forecast-icon { font-size: 1.5rem; width: 40px; text-align: center; }
    .forecast-desc {
      flex: 1;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      padding: 0 8px;
    }
    .forecast-temps {
      display: flex;
      gap: 8px;
      font-size: 0.9rem;
    }
    .forecast-temps .high { font-weight: 600; }
    .forecast-temps .low { color: var(--text-muted); }

    /* ========== 加载与错误 ========== */
    .loading {
      text-align: center;
      padding: 40px;
      display: none;
    }
    .loading.visible { display: block; }
    .loading .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      text-align: center;
      padding: 20px;
      color: #ff6b6b;
      font-size: 0.9rem;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* ========== 初始提示 ========== */
    .hint {
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 60px 20px;
    }
    .hint .icon { font-size: 3rem; margin-bottom: 12px; }
    .hint p { line-height: 1.6; }

    /* ========== 移动端响应式 ========== */
    @media (max-width: 480px) {
      .app { padding: 16px 12px; gap: 16px; }
      .weather-card { padding: 24px 16px; }
      .weather-icon, .temperature { font-size: 3rem; }
      .details-grid { gap: 8px; }
      .detail-item { padding: 10px 8px; }
      .detail-item .value { font-size: 1rem; }
      .search-area input { padding: 10px 14px; font-size: 0.9rem; }
      .search-area button { padding: 10px 16px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <!-- 动态背景画布 -->
  <canvas id="bgCanvas"></canvas>

  <div class="app">
    <!-- 返回主页链接 -->
    <a href="../../" class="back-link">← 返回 Garden City</a>

    <h1 style="font-size:1.4rem; text-align:center;">🌤️ 天气应用</h1>

    <!-- 搜索区域 -->
    <div class="search-area">
      <input type="text" id="cityInput" placeholder="输入城市名称（如：北京、Tokyo）" autocomplete="off">
      <button id="searchBtn">搜索</button>
    </div>

    <!-- 错误提示 -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- 加载动画 -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>正在获取天气数据...</span>
    </div>

    <!-- 初始提示 -->
    <div class="hint" id="hint">
      <div class="icon">🔍</div>
      <p>输入城市名称<br>查看实时天气</p>
    </div>

    <!-- 天气主卡片 -->
    <div class="weather-card" id="weatherCard">
      <div class="location" id="locationName">--</div>
      <div class="date" id="dateText">--</div>
      <div class="weather-main">
        <div class="weather-icon" id="weatherIcon">--</div>
        <div class="temperature"><span id="tempValue">--</span><span class="unit">°C</span></div>
      </div>
      <div class="weather-description" id="weatherDesc">--</div>
      <div class="details-grid">
        <div class="detail-item">
          <div class="label">体感温度</div>
          <div class="value" id="feelsLike">--°</div>
        </div>
        <div class="detail-item">
          <div class="label">湿度</div>
          <div class="value" id="humidity">--%</div>
        </div>
        <div class="detail-item">
          <div class="label">风速</div>
          <div class="value" id="windSpeed">-- km/h</div>
        </div>
        <div class="detail-item">
          <div class="label">降水概率</div>
          <div class="value" id="precipProb">--%</div>
        </div>
      </div>
    </div>

    <!-- 每小时预报 -->
    <div class="hourly-section" id="hourlySection">
      <h3>⏰ 24小时预报</h3>
      <div class="hourly-scroll" id="hourlyScroll"></div>
    </div>

    <!-- 7天预报 -->
    <div class="forecast-section" id="forecastSection">
      <h3>📅 7天预报</h3>
      <div id="forecastList"></div>
    </div>
  </div>

  <script>
    // ========== 天气应用主逻辑 ==========
    // 使用 Open-Meteo 免费 API（无需 API Key）
    // 文档：https://open-meteo.com/en/docs

    const GEO_API = 'https://geocoding-api.open-meteo.com/v1/search';
    const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';

    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const loading = document.getElementById('loading');
    const hint = document.getElementById('hint');
    const errorMsg = document.getElementById('errorMsg');
    const weatherCard = document.getElementById('weatherCard');
    const hourlySection = document.getElementById('hourlySection');
    const forecastSection = document.getElementById('forecastSection');

    // WMO 天气代码映射到 emoji 和中文描述
    const WMO_CODES = {
      0: { icon: '☀️', desc: '晴朗' },
      1: { icon: '🌤️', desc: '大部晴朗' },
      2: { icon: '⛅', desc: '多云' },
      3: { icon: '☁️', desc: '阴天' },
      45: { icon: '🌫️', desc: '雾' },
      48: { icon: '🌫️', desc: '冻雾' },
      51: { icon: '🌦️', desc: '小毛毛雨' },
      53: { icon: '🌦️', desc: '中毛毛雨' },
      55: { icon: '🌦️', desc: '大毛毛雨' },
      56: { icon: '🌧️', desc: '冻毛毛雨' },
      57: { icon: '🌧️', desc: '冻毛毛雨' },
      61: { icon: '🌧️', desc: '小雨' },
      63: { icon: '🌧️', desc: '中雨' },
      65: { icon: '🌧️', desc: '大雨' },
      66: { icon: '🌧️', desc: '冻雨' },
      67: { icon: '🌧️', desc: '冻雨' },
      71: { icon: '🌨️', desc: '小雪' },
      73: { icon: '🌨️', desc: '中雪' },
      75: { icon: '❄️', desc: '大雪' },
      77: { icon: '❄️', desc: '雪粒' },
      80: { icon: '🌦️', desc: '小阵雨' },
      81: { icon: '🌧️', desc: '中阵雨' },
      82: { icon: '⛈️', desc: '大阵雨' },
      85: { icon: '🌨️', desc: '小阵雪' },
      86: { icon: '🌨️', desc: '大阵雪' },
      95: { icon: '⛈️', desc: '雷暴' },
      96: { icon: '⛈️', desc: '雷暴+冰雹' },
      99: { icon: '⛈️', desc: '雷暴+大冰雹' },
    };

    // 根据天气代码获取图标和描述
    function getWMO(code) {
      return WMO_CODES[code] || { icon: '🌡️', desc: '未知' };
    }

    // 根据天气代码和时间选择动态背景
    function updateBackground(code, isNight) {
      const canvas = document.getElementById('bgCanvas');
      let gradient;

      if (isNight) {
        // 夜晚背景
        gradient = 'linear-gradient(135deg, #0c1445 0%, #1a1a3e 50%, #0d1b2a 100%)';
      } else if (code === 0 || code === 1) {
        // 晴天
        gradient = 'linear-gradient(135deg, #f093fb 0%, #f5576c 30%, #4facfe 100%)';
      } else if (code === 2 || code === 3) {
        // 多云
        gradient = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
      } else if (code >= 51 && code <= 67) {
        // 雨天
        gradient = 'linear-gradient(135deg, #3a7bd5 0%, #3a6073 100%)';
      } else if (code >= 71 && code <= 86) {
        // 雪天
        gradient = 'linear-gradient(135deg, #e6dada 0%, #274046 100%)';
      } else if (code >= 95) {
        // 雷暴
        gradient = 'linear-gradient(135deg, #232526 0%, #414345 50%, #2c3e50 100%)';
      } else {
        gradient = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
      }

      document.body.style.background = gradient;
    }

    // 显示/隐藏 UI 状态
    function showState(state) {
      loading.classList.remove('visible');
      hint.style.display = 'none';
      errorMsg.classList.remove('visible');
      weatherCard.classList.remove('visible');
      hourlySection.classList.remove('visible');
      forecastSection.classList.remove('visible');

      if (state === 'loading') loading.classList.add('visible');
      else if (state === 'hint') hint.style.display = 'block';
      else if (state === 'error') errorMsg.classList.add('visible');
      else if (state === 'result') {
        weatherCard.classList.add('visible');
        hourlySection.classList.add('visible');
        forecastSection.classList.add('visible');
      }
    }

    // 显示错误信息
    function showError(msg) {
      errorMsg.textContent = msg;
      showState('error');
    }

    // 星期名映射
    const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    // ========== 搜索天气 ==========
    async function searchWeather() {
      const city = cityInput.value.trim();
      if (!city) return;

      showState('loading');

      try {
        // 第一步：地理编码 — 获取城市经纬度
        const geoRes = await fetch(`${GEO_API}?name=${encodeURIComponent(city)}&count=1&language=zh`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          showError('找不到该城市，请检查输入');
          return;
        }

        const loc = geoData.results[0];
        const { latitude, longitude, name, country, admin1 } = loc;

        // 第二步：获取天气数据
        const params = new URLSearchParams({
          latitude: latitude,
          longitude: longitude,
          current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,is_day',
          hourly: 'temperature_2m,weather_code,is_day',
          daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
          timezone: 'auto',
          forecast_days: 7,
        });

        const weatherRes = await fetch(`${WEATHER_API}?${params}`);
        const data = await weatherRes.json();

        // 更新当前天气卡片
        const current = data.current;
        const wmo = getWMO(current.weather_code);
        const isNight = !current.is_day;

        document.getElementById('locationName').textContent =
          admin1 ? `${name}, ${admin1}` : `${name}, ${country}`;
        document.getElementById('dateText').textContent =
          new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        document.getElementById('weatherIcon').textContent = wmo.icon;
        document.getElementById('tempValue').textContent = Math.round(current.temperature_2m);
        document.getElementById('weatherDesc').textContent = isNight ? `夜间 · ${wmo.desc}` : wmo.desc;
        document.getElementById('feelsLike').textContent = `${Math.round(current.apparent_temperature)}°`;
        document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
        document.getElementById('windSpeed').textContent = `${Math.round(current.wind_speed_10m)} km/h`;

        // 降水概率（取当日）
        const todayPrecip = data.daily.precipitation_probability_max[0];
        document.getElementById('precipProb').textContent = `${todayPrecip}%`;

        // 动态背景
        updateBackground(current.weather_code, isNight);

        // 渲染24小时预报
        const hourlyScroll = document.getElementById('hourlyScroll');
        hourlyScroll.innerHTML = '';
        const now = new Date();
        const currentHour = now.getHours();
        // 找到当前小时在数据中的索引
        const hourlyTimes = data.hourly.time;
        let startIdx = 0;
        for (let i = 0; i < hourlyTimes.length; i++) {
          const hTime = new Date(hourlyTimes[i]);
          if (hTime >= now) { startIdx = Math.max(0, i - 1); break; }
        }

        for (let i = startIdx; i < Math.min(startIdx + 24, hourlyTimes.length); i++) {
          const time = new Date(hourlyTimes[i]);
          const hWmo = getWMO(data.hourly.weather_code[i]);
          const hTemp = Math.round(data.hourly.temperature_2m[i]);
          const label = i === startIdx ? '现在' : `${time.getHours()}:00`;

          const item = document.createElement('div');
          item.className = 'hourly-item';
          item.innerHTML = `
            <div class="time">${label}</div>
            <div class="h-icon">${hWmo.icon}</div>
            <div class="h-temp">${hTemp}°</div>
          `;
          hourlyScroll.appendChild(item);
        }

        // 渲染7天预报
        const forecastList = document.getElementById('forecastList');
        forecastList.innerHTML = '';
        const daily = data.daily;

        for (let i = 0; i < daily.time.length; i++) {
          const date = new Date(daily.time[i] + 'T00:00:00');
          const dayName = i === 0 ? '今天' : WEEKDAYS[date.getDay()];
          const dWmo = getWMO(daily.weather_code[i]);
          const high = Math.round(daily.temperature_2m_max[i]);
          const low = Math.round(daily.temperature_2m_min[i]);

          const item = document.createElement('div');
          item.className = 'forecast-item';
          item.innerHTML = `
            <div class="forecast-day">${dayName}</div>
            <div class="forecast-icon">${dWmo.icon}</div>
            <div class="forecast-desc">${dWmo.desc}</div>
            <div class="forecast-temps">
              <span class="high">${high}°</span>
              <span class="low">${low}°</span>
            </div>
          `;
          forecastList.appendChild(item);
        }

        showState('result');

      } catch (err) {
        console.error('Weather fetch error:', err);
        showError('获取天气数据失败，请检查网络连接');
      }
    }

    // ========== 事件绑定 ==========
    searchBtn.addEventListener('click', searchWeather);
    cityInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') searchWeather();
    });

    // ========== 动态背景粒子动画 ==========
    (function initBgCanvas() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let animId;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // 创建浮动粒子
      function createParticles() {
        particles = [];
        const count = Math.floor(window.innerWidth / 20);
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: 1 + Math.random() * 2,
            dx: (Math.random() - 0.5) * 0.3,
            dy: -0.2 - Math.random() * 0.3,
            alpha: 0.1 + Math.random() * 0.3,
          });
        }
      }
      createParticles();

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.dx;
          p.y += p.dy;

          // 超出边界则重置
          if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
          if (p.x < -10) p.x = canvas.width + 10;
          if (p.x > canvas.width + 10) p.x = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
          ctx.fill();
        });
        animId = requestAnimationFrame(animate);
      }
      animate();
    })();

    // ========== 初始状态 ==========
    showState('hint');
  </script>
</body>
</html>
