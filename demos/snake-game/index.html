<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>贪吃蛇游戏 — Garden City Demo</title>
  <style>
    /* ========== CSS 变量与重置 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ========== 主容器 ========== */
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px;
      max-width: 100vw;
    }

    /* 返回链接 */
    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      align-self: flex-start;
      transition: color 0.2s;
    }
    .back-link:hover { color: #34d399; }

    /* ========== 标题栏 ========== */
    .title-bar {
      text-align: center;
    }
    .title-bar h1 {
      font-size: 1.4rem;
      background: linear-gradient(135deg, #34d399, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    /* ========== 信息栏 ========== */
    .info-bar {
      display: flex;
      gap: 24px;
      font-size: 0.95rem;
    }
    .info-bar .label { color: #94a3b8; }
    .info-bar .value { font-weight: 700; color: #34d399; }

    /* ========== 游戏画布 ========== */
    #gameCanvas {
      border: 2px solid #334155;
      border-radius: 8px;
      background: #1e293b;
      touch-action: none;
    }

    /* ========== 游戏状态覆盖层 ========== */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 8px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }

    .overlay .icon { font-size: 3rem; margin-bottom: 12px; }
    .overlay h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    .overlay .score-text {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .overlay .score-text span {
      color: #34d399;
      font-weight: 700;
    }

    /* 开始/重新开始按钮 */
    .btn {
      padding: 12px 32px;
      background: linear-gradient(135deg, #34d399, #06b6d4);
      border: none;
      border-radius: 10px;
      color: #0f172a;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      letter-spacing: 1px;
    }
    .btn:hover { box-shadow: 0 4px 20px rgba(52, 211, 153, 0.4); }
    .btn:active { transform: scale(0.96); }

    /* ========== 手机方向键控制 ========== */
    .controls {
      display: none;
      grid-template-areas:
        ".  up  ."
        "left . right"
        ".  down  .";
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 6px;
      margin-top: 8px;
    }

    .ctrl-btn {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:active {
      background: #475569;
      transform: scale(0.93);
    }
    .ctrl-btn[data-dir="up"]    { grid-area: up; }
    .ctrl-btn[data-dir="left"]  { grid-area: left; }
    .ctrl-btn[data-dir="right"] { grid-area: right; }
    .ctrl-btn[data-dir="down"]  { grid-area: down; }

    /* ========== 键盘提示 ========== */
    .keyboard-hint {
      color: #475569;
      font-size: 0.8rem;
      text-align: center;
      margin-top: 4px;
    }

    /* ========== 最高分记录 ========== */
    .best-score {
      color: #64748b;
      font-size: 0.85rem;
    }
    .best-score span { color: #fbbf24; font-weight: 600; }

    /* ========== 移动端响应式 ========== */
    @media (max-width: 600px) {
      .controls { display: grid; }
      .keyboard-hint { display: none; }
      .title-bar h1 { font-size: 1.2rem; }
      .info-bar { gap: 16px; font-size: 0.85rem; }
    }

    @media (hover: none) and (pointer: coarse) {
      .controls { display: grid; }
      .keyboard-hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <a href="../../" class="back-link">← 返回 Garden City</a>

    <div class="title-bar">
      <h1>🐍 贪吃蛇</h1>
    </div>

    <!-- 分数信息 -->
    <div class="info-bar">
      <div><span class="label">得分 </span><span class="value" id="score">0</span></div>
      <div><span class="label">长度 </span><span class="value" id="length">3</span></div>
    </div>

    <!-- 游戏画布（需要相对定位以便放置覆盖层） -->
    <div style="position: relative; display: inline-block;">
      <canvas id="gameCanvas"></canvas>

      <!-- 开始/游戏结束覆盖层 -->
      <div class="overlay" id="overlay">
        <div class="icon" id="overlayIcon">🐍</div>
        <h2 id="overlayTitle">贪吃蛇</h2>
        <div class="score-text" id="overlayScore">经典街机游戏</div>
        <button class="btn" id="startBtn">开始游戏</button>
      </div>
    </div>

    <!-- 最高分 -->
    <div class="best-score">🏆 最高分: <span id="bestScore">0</span></div>

    <!-- 手机虚拟方向键 -->
    <div class="controls" id="controls">
      <button class="ctrl-btn" data-dir="up">▲</button>
      <button class="ctrl-btn" data-dir="left">◀</button>
      <button class="ctrl-btn" data-dir="right">▶</button>
      <button class="ctrl-btn" data-dir="down">▼</button>
    </div>

    <div class="keyboard-hint">使用 方向键 / WASD 控制方向 · 空格键暂停</div>
  </div>

  <script>
    // ========== 贪吃蛇游戏主逻辑 ==========
    // 经典贪吃蛇，使用 Canvas 2D 渲染
    // 支持键盘（方向键/WASD）和触屏（虚拟方向键+滑动手势）

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ===== 游戏配置 =====
    const GRID_SIZE = 20;          // 每个格子像素大小
    const COLS = 20;               // 列数
    const ROWS = 20;               // 行数
    const BASE_SPEED = 150;        // 初始速度（毫秒/步）
    const MIN_SPEED = 60;          // 最快速度
    const SPEED_INCREMENT = 2;     // 每吃一个食物加速

    canvas.width = COLS * GRID_SIZE;
    canvas.height = ROWS * GRID_SIZE;

    // ===== 游戏状态 =====
    let snake = [];                // 蛇身数组 [{x, y}, ...]
    let food = {};                 // 食物位置 {x, y}
    let direction = { x: 1, y: 0 }; // 当前方向
    let nextDirection = { x: 1, y: 0 }; // 下一步方向（防止反向）
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('snake-best') || '0');
    let gameLoop = null;           // 游戏定时器
    let speed = BASE_SPEED;        // 当前速度
    let isRunning = false;
    let isPaused = false;

    const scoreEl = document.getElementById('score');
    const lengthEl = document.getElementById('length');
    const bestScoreEl = document.getElementById('bestScore');
    const overlay = document.getElementById('overlay');
    const overlayIcon = document.getElementById('overlayIcon');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayScore = document.getElementById('overlayScore');
    const startBtn = document.getElementById('startBtn');

    // 初始化最高分显示
    bestScoreEl.textContent = bestScore;

    // ===== 初始化游戏 =====
    function initGame() {
      // 蛇初始位置（从中间开始，3节长度，向右移动）
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 },
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      speed = BASE_SPEED;
      scoreEl.textContent = '0';
      lengthEl.textContent = '3';
      spawnFood();
    }

    // ===== 生成食物（避免出现在蛇身上） =====
    function spawnFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    // ===== 游戏主循环 =====
    function gameStep() {
      // 应用方向（防止在同一步内反向）
      direction = { ...nextDirection };

      // 计算新的头部位置
      const head = snake[0];
      const newHead = {
        x: head.x + direction.x,
        y: head.y + direction.y,
      };

      // 碰墙检测
      if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
        gameOver();
        return;
      }

      // 碰自身检测
      if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
        gameOver();
        return;
      }

      // 移动蛇
      snake.unshift(newHead);

      // 吃食物检测
      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        lengthEl.textContent = snake.length;

        // 加速
        speed = Math.max(MIN_SPEED, speed - SPEED_INCREMENT);
        clearInterval(gameLoop);
        gameLoop = setInterval(gameStep, speed);

        spawnFood();
      } else {
        // 没吃到食物，移除尾部
        snake.pop();
      }

      // 重绘
      draw();
    }

    // ===== 渲染画面 =====
    function draw() {
      // 清除画布
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 绘制网格线（轻微显示）
      ctx.strokeStyle = 'rgba(51, 65, 85, 0.3)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // 绘制食物（带脉冲动画效果）
      const pulse = 0.8 + 0.2 * Math.sin(Date.now() / 200);
      const foodX = food.x * GRID_SIZE + GRID_SIZE / 2;
      const foodY = food.y * GRID_SIZE + GRID_SIZE / 2;
      const foodR = (GRID_SIZE / 2 - 2) * pulse;

      ctx.beginPath();
      ctx.arc(foodX, foodY, foodR, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
      // 食物高光
      ctx.beginPath();
      ctx.arc(foodX - 2, foodY - 2, foodR * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fill();

      // 绘制蛇身
      snake.forEach((seg, i) => {
        const x = seg.x * GRID_SIZE;
        const y = seg.y * GRID_SIZE;
        const padding = 1;

        if (i === 0) {
          // 蛇头 — 更亮的颜色 + 圆角
          ctx.fillStyle = '#34d399';
          roundRect(ctx, x + padding, y + padding,
            GRID_SIZE - padding * 2, GRID_SIZE - padding * 2, 5);
          ctx.fill();

          // 蛇眼
          drawEyes(seg, direction);
        } else {
          // 蛇身 — 渐变色（越靠后越暗）
          const ratio = 1 - (i / snake.length) * 0.5;
          const r = Math.round(16 * ratio);
          const g = Math.round(185 * ratio);
          const b = Math.round(129 * ratio);
          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
          roundRect(ctx, x + padding, y + padding,
            GRID_SIZE - padding * 2, GRID_SIZE - padding * 2, 3);
          ctx.fill();
        }
      });
    }

    // 绘制圆角矩形辅助函数
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // 绘制蛇眼
    function drawEyes(head, dir) {
      const cx = head.x * GRID_SIZE + GRID_SIZE / 2;
      const cy = head.y * GRID_SIZE + GRID_SIZE / 2;
      const eyeSize = 2.5;
      const offset = 4;

      let eye1, eye2;
      if (dir.x === 1) {        // 向右
        eye1 = { x: cx + offset, y: cy - offset };
        eye2 = { x: cx + offset, y: cy + offset };
      } else if (dir.x === -1) { // 向左
        eye1 = { x: cx - offset, y: cy - offset };
        eye2 = { x: cx - offset, y: cy + offset };
      } else if (dir.y === -1) { // 向上
        eye1 = { x: cx - offset, y: cy - offset };
        eye2 = { x: cx + offset, y: cy - offset };
      } else {                   // 向下
        eye1 = { x: cx - offset, y: cy + offset };
        eye2 = { x: cx + offset, y: cy + offset };
      }

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(eye1.x, eye1.y, eyeSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eye2.x, eye2.y, eyeSize, 0, Math.PI * 2);
      ctx.fill();

      // 瞳孔
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(eye1.x + dir.x * 0.5, eye1.y + dir.y * 0.5, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eye2.x + dir.x * 0.5, eye2.y + dir.y * 0.5, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // ===== 游戏结束 =====
    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);

      // 更新最高分
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('snake-best', bestScore.toString());
        bestScoreEl.textContent = bestScore;
      }

      // 显示结束覆盖层
      overlayIcon.textContent = '💀';
      overlayTitle.textContent = '游戏结束';
      overlayScore.innerHTML = `得分: <span>${score}</span>`;
      startBtn.textContent = '再来一局';
      overlay.classList.remove('hidden');
    }

    // ===== 开始/暂停游戏 =====
    function startGame() {
      initGame();
      isRunning = true;
      isPaused = false;
      overlay.classList.add('hidden');
      draw();
      gameLoop = setInterval(gameStep, speed);
    }

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;
      if (isPaused) {
        clearInterval(gameLoop);
        // 显示暂停覆盖层
        overlayIcon.textContent = '⏸️';
        overlayTitle.textContent = '已暂停';
        overlayScore.textContent = '按空格键继续';
        startBtn.textContent = '继续';
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
        gameLoop = setInterval(gameStep, speed);
      }
    }

    // ===== 键盘控制 =====
    document.addEventListener('keydown', function(e) {
      // 空格键暂停/继续
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isRunning && !overlay.classList.contains('hidden')) {
          startGame();
        } else {
          togglePause();
        }
        return;
      }

      if (!isRunning || isPaused) return;

      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
          if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
          break;
        case 'ArrowDown': case 's': case 'S':
          if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
          break;
        case 'ArrowLeft': case 'a': case 'A':
          if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
          break;
        case 'ArrowRight': case 'd': case 'D':
          if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
          break;
      }
    });

    // ===== 虚拟方向键控制 =====
    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if (!isRunning || isPaused) return;

        const dir = this.getAttribute('data-dir');
        switch (dir) {
          case 'up':    if (direction.y !== 1) nextDirection = { x: 0, y: -1 }; break;
          case 'down':  if (direction.y !== -1) nextDirection = { x: 0, y: 1 }; break;
          case 'left':  if (direction.x !== 1) nextDirection = { x: -1, y: 0 }; break;
          case 'right': if (direction.x !== -1) nextDirection = { x: 1, y: 0 }; break;
        }
      });

      // 也支持鼠标点击
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        if (!isRunning || isPaused) return;

        const dir = this.getAttribute('data-dir');
        switch (dir) {
          case 'up':    if (direction.y !== 1) nextDirection = { x: 0, y: -1 }; break;
          case 'down':  if (direction.y !== -1) nextDirection = { x: 0, y: 1 }; break;
          case 'left':  if (direction.x !== 1) nextDirection = { x: -1, y: 0 }; break;
          case 'right': if (direction.x !== -1) nextDirection = { x: 1, y: 0 }; break;
        }
      });
    });

    // ===== 滑动手势控制（移动端） =====
    let touchStartX = 0, touchStartY = 0;

    canvas.addEventListener('touchstart', function(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', function(e) {
      if (!isRunning || isPaused) return;

      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      // 最小滑动距离
      if (Math.max(absDx, absDy) < 20) return;

      if (absDx > absDy) {
        // 水平滑动
        if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
        else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
      } else {
        // 垂直滑动
        if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
        else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
      }
    }, { passive: true });

    // ===== 开始按钮事件 =====
    startBtn.addEventListener('click', function() {
      if (isPaused) {
        togglePause();
      } else {
        startGame();
      }
    });

    // ===== 初始画面渲染 =====
    initGame();
    draw();
  </script>

  <!-- 访问统计 -->
  <script src="../../stats.js"></script>
  <script>GardenStats.trackVisit('snake-game');</script>
</body>
</html>
