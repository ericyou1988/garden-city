<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>达芬奇扑翼机 — 自研 3D 引擎</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--text:#e0e0e0;--text2:#a0a0b0;--accent:#00d4ff;--accent2:#00ffa3;--border:rgba(255,255,255,0.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
#c{position:fixed;inset:0;z-index:1;display:block}
.float-ui{position:fixed;inset:0;z-index:10;pointer-events:none;transition:opacity .3s}
.float-ui.hidden{opacity:0;pointer-events:none}
.float-ui.hidden>*{pointer-events:none!important}
.float-ui>*{pointer-events:auto}
.top{position:fixed;top:0;left:0;right:0;padding:20px 30px;background:linear-gradient(180deg,rgba(10,10,15,.95),transparent);display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.top h1{font-size:1.4rem;font-weight:600;letter-spacing:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top p{font-size:.8rem;color:var(--text2);margin-top:4px}
.side{position:fixed;top:80px;right:20px;bottom:100px;width:300px;background:rgba(10,15,25,.9);border:1px solid var(--border);border-radius:12px;padding:24px;overflow-y:auto;backdrop-filter:blur(10px)}
.side h3{font-size:.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.side p{font-size:.85rem;line-height:1.6;color:var(--text2)}
.parts{display:flex;flex-direction:column;gap:6px}
.part-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;font-size:.8rem;color:var(--text2);cursor:pointer;transition:all .2s;border:1px solid transparent}
.part-item:hover{background:rgba(0,212,255,.08);border-color:var(--accent);color:var(--text)}
.part-color{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:12px 20px;background:rgba(10,15,25,.9);border:1px solid var(--border);border-radius:30px;backdrop-filter:blur(10px)}
.controls button{padding:8px 18px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);border-radius:20px;color:var(--accent);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.controls button:hover{background:rgba(0,212,255,.2);box-shadow:0 0 12px rgba(0,212,255,.4)}
.controls button.active{background:rgba(0,212,255,.3);border-color:var(--accent);color:#fff}
.hints{position:fixed;bottom:80px;left:30px;display:flex;gap:12px;font-size:.75rem;color:var(--text2)}
.hints kbd{padding:2px 6px;background:rgba(255,255,255,.1);border:1px solid var(--border);border-radius:4px;font-size:.7rem;color:var(--text)}
.ui-toggle{position:fixed;top:20px;right:20px;z-index:20;width:44px;height:44px;border-radius:50%;background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.3);color:var(--accent);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ui-toggle:hover{background:rgba(0,212,255,.3);transform:scale(1.1)}
@media(max-width:768px){
  .side{width:calc(100% - 40px);right:20px;left:20px;top:auto;bottom:160px;max-height:40vh}
  .top{padding:12px 16px}.top h1{font-size:1rem}
  .controls{bottom:10px;padding:8px 12px;gap:6px}.controls button{padding:6px 12px;font-size:.7rem}
  .hints{display:none}
  .ui-toggle{top:12px;right:12px;width:36px;height:36px;font-size:1rem}
}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="float-ui" id="floatUi">
<div class="top"><div><h1>🛸 达芬奇扑翼机</h1><p>自研轻量 3D 引擎 · Canvas 2D</p></div></div>
<div class="side">
  <h3>📐 历史背景</h3>
  <p>列奥纳多·达·芬奇（1452-1519）在 1485 年左右设计了扑翼机（Ornithopter），这是人类最早的飞行器设计之一。</p>
  <h3 style="margin-top:20px">⚙️ 部件说明</h3>
  <div class="parts" id="parts"></div>
  <h3 style="margin-top:20px">🔬 工作原理</h3>
  <p>飞行员通过脚踏踏板驱动曲柄机构，带动四连杆系统使机翼上下扑动。机翼模仿鸟类翅膀，利用空气动力学产生推力与升力。</p>
</div>
<div class="controls">
  <button id="bExplode" onclick="toggleExplode()">💥 爆炸图</button>
  <button id="bRotate" class="active" onclick="toggleRotate()">🔄 自动旋转</button>
  <button id="bReset" onclick="resetView()">🎯 重置</button>
  <button id="bWire" onclick="toggleWire()">🔲 线框</button>
  <button onclick="location.href='../../index.html'">⬅ 主页</button>
</div>
<div class="hints"><span><kbd>左键</kbd> 旋转</span><span><kbd>滚轮</kbd> 缩放</span><span><kbd>右键</kbd> 平移</span><span><kbd>点击</kbd> 高亮</span></div>
</div>
<button class="ui-toggle" id="bToggle" onclick="toggleUI()" title="隐藏/显示 面板">👁️</button>

<script>
(function(){
'use strict';

// ── 向量工具 ──
const V={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  scale:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{const l=V.len(a);return l>0?[a[0]/l,a[1]/l,a[2]/l]:[0,0,0];}
};

// ── 全局状态 ──
let canvas,ctx,W,H;
let camera={pos:[6,3,8],target:[0,0,0],fov:50,near:0.1,far:100};
let autoRotate=true,exploded=false,wireframe=false;
let parts=[];
let time=0;
let mouse={x:0,y:0,down:false,button:0,lastX:0,lastY:0};
let hoveredPart=null;
let azimuth=0.6,elevation=0.4,distance=10;

// ── 部件定义 ──
const PART_DEFS=[
  {key:'fuselage',name:'机身骨架',color:'#8B7355',explode:[0,0,0]},
  {key:'cockpit',name:'驾驶舱',color:'#4A90D9',explode:[0,0.6,0.3]},
  {key:'leftWing',name:'左翼',color:'#C4A35A',explode:[-3,0.2,0]},
  {key:'rightWing',name:'右翼',color:'#C4A35A',explode:[3,0.2,0]},
  {key:'tailWing',name:'尾翼',color:'#B8946A',explode:[0,0.3,-2.5]},
  {key:'landing',name:'起落架',color:'#666666',explode:[0,-1.2,0]},
  {key:'mechanism',name:'扑翼机构',color:'#CC7733',explode:[0,-0.6,0.8]},
  {key:'propeller',name:'尾桨',color:'#AA6644',explode:[0,0.2,-2]},
];

// ── 图元 ──
function face(v,c,k){return{verts:v,color:c,partKey:k,highlight:false};}
function box(w,h,d,ox,oy,oz){
  const x=w/2,y=h/2,z=d/2;
  const v=[[-x+ox,-y+oy,z+oz],[x+ox,-y+oy,z+oz],[x+ox,y+oy,z+oz],[-x+ox,y+oy,z+oz],
        [-x+ox,-y+oy,-z+oz],[x+ox,-y+oy,-z+oz],[x+ox,y+oy,-z+oz],[-x+ox,y+oy,-z+oz]];
  return[face([v[0],v[1],v[2],v[3]],null),face([v[5],v[4],v[7],v[6]],null),
         face([v[4],v[0],v[3],v[7]],null),face([v[1],v[5],v[6],v[2]],null),
         face([v[3],v[2],v[6],v[7]],null),face([v[4],v[5],v[1],v[0]],null)];
}
function cyl(r1,r2,h,ox,oy,oz,seg){
  seg=seg||12;const f=[];
  for(let i=0;i<seg;i++){
    const a1=(i/seg)*Math.PI*2,a2=((i+1)/seg)*Math.PI*2;
    const c1=Math.cos(a1),s1=Math.sin(a1),c2=Math.cos(a2),s2=Math.sin(a2);
    f.push(face([[r1*c1+ox,oy,r1*s1+oz],[r2*c1+ox,-h+oy,r2*s1+oz],[r2*c2+ox,-h+oy,r2*s2+oz],[r1*c2+ox,oy,r1*s2+oz]],null));
  }
  const t=[],b=[];
  for(let i=0;i<seg;i++){const a=(i/seg)*Math.PI*2;t.push([r1*Math.cos(a)+ox,oy,r1*Math.sin(a)+oz]);b.push([r2*Math.cos(a)+ox,-h+oy,r2*Math.sin(a)+oz]);}
  f.push(face(t,null));f.push(face(b,null));
  return f;
}
function torus(r,tube,ox,oy,oz,seg){
  seg=seg||16;const f=[];
  for(let i=0;i<seg;i++){
    const a1=(i/seg)*Math.PI*2,a2=((i+1)/seg)*Math.PI*2;
    for(let j=0;j<4;j++){
      const b1=(j/4)*Math.PI*2,b2=((j+1)/4)*Math.PI*2;
      f.push(face([
        [(r+tube*Math.cos(b1))*Math.cos(a1)+ox,tube*Math.sin(b1)+oy,(r+tube*Math.cos(b1))*Math.sin(a1)+oz],
        [(r+tube*Math.cos(b2))*Math.cos(a1)+ox,tube*Math.sin(b2)+oy,(r+tube*Math.cos(b2))*Math.sin(a1)+oz],
        [(r+tube*Math.cos(b2))*Math.cos(a2)+ox,tube*Math.sin(b2)+oy,(r+tube*Math.cos(b2))*Math.sin(a2)+oz],
        [(r+tube*Math.cos(b1))*Math.cos(a2)+ox,tube*Math.sin(b1)+oy,(r+tube*Math.cos(b1))*Math.sin(a2)+oz],
      ],null));
    }
  }
  return f;
}
function hemisphere(r,ox,oy,oz,seg,stacks){
  seg=seg||12;stacks=stacks||6;const f=[];
  for(let i=0;i<stacks;i++){
    const p1=(i/stacks)*(Math.PI/2),p2=((i+1)/stacks)*(Math.PI/2);
    for(let j=0;j<seg;j++){
      const t1=(j/seg)*Math.PI*2,t2=((j+1)/seg)*Math.PI*2;
      f.push(face([
        [r*Math.sin(p1)*Math.cos(t1)+ox,r*Math.cos(p1)+oy,r*Math.sin(p1)*Math.sin(t1)+oz],
        [r*Math.sin(p2)*Math.cos(t1)+ox,r*Math.cos(p2)+oy,r*Math.sin(p2)*Math.sin(t1)+oz],
        [r*Math.sin(p2)*Math.cos(t2)+ox,r*Math.cos(p2)+oy,r*Math.sin(p2)*Math.sin(t2)+oz],
        [r*Math.sin(p1)*Math.cos(t2)+ox,r*Math.cos(p1)+oy,r*Math.sin(p1)*Math.sin(t2)+oz],
      ],null));
    }
  }
  return f;
}
function wing(span,root,tip,chord,th,ox,oy,oz){
  const h=span/2;
  const v=[[ox,oy+chord*.3,oz+root],[ox,oy+chord*.1,oz+tip],[ox,oy-chord*.1,oz+tip-th],[ox,oy+chord*.3,oz+root-th],
           [ox+h,oy+chord*.25,oz+root],[ox+h,oy+chord*.05,oz+tip],[ox+h,oy+chord*.05,oz+tip-th],[ox+h,oy+chord*.25,oz+root-th]];
  return[face([v[0],v[1],v[5],v[4]],null),face([v[2],v[3],v[7],v[6]],null),face([v[0],v[3],v[2],v[1]],null),
         face([v[4],v[5],v[6],v[7]],null),face([v[0],v[4],v[7],v[3]],null),face([v[1],v[2],v[6],v[5]],null)];
}

// ── 构建模型 ──
function buildModel(){
  PART_DEFS.forEach(d=>{
    let f=[];
    switch(d.key){
      case 'fuselage':
        f.push(...cyl(.15,.1,3.5,0,0,0,8));
        for(let i=-1.2;i<=1.2;i+=.6)f.push(...torus(.18,.02,i,0,0,8,12));
        for(let i=0;i<4;i++){const a=(i/4)*Math.PI*2;f.push(...cyl(.015,.015,3.2,Math.sin(a)*.15,0,Math.cos(a)*.15,6));}
        break;
      case 'cockpit':
        f.push(...hemisphere(.35,0,.2,0,16,8));
        f.push(...cyl(.35,.3,.15,0,.05,0,16));
        break;
      case 'leftWing':
        f.push(...wing(2.5,0,2.8,.5,.04,0,0,0));
        f.push(...cyl(.02,.02,2.2,1.1,0,.02,6));
        for(let i=.5;i<2.5;i+=.5)f.push(...box(.02,.15,.05,i,0,.02));
        break;
      case 'rightWing':
        f.push(...wing(-2.5,0,-2.8,.5,.04,0,0,0));
        f.push(...cyl(.02,.02,2.2,-1.1,0,.02,6));
        for(let i=-.5;i>-2.5;i-=.5)f.push(...box(.02,.15,.05,i,0,.02));
        break;
      case 'tailWing':
        f.push(...box(.03,.8,.5,0,.4,-1.6));
        f.push(...box(.8,.02,.3,0,0,-1.6));
        break;
      case 'landing':
        [[0,1],[-.5,-.8],[.5,-.8]].forEach(p=>{
          f.push(...cyl(.02,.02,.5,p[0],-.35,p[1],6));
          f.push(...cyl(.08,.08,.04,p[0],-.6,p[1],12));
        });
        f.push(...cyl(.015,.015,1,0,-.6,-.8,6));
        break;
        case 'mechanism':
        f.push(...cyl(.08,.08,.3,0,-.3,0,8));
        for(let s=-1;s<=1;s+=2){
          f.push(...box(.04,.25,.04,s*.15,-.2,0));
          f.push(...box(.03,.4,.03,s*.25,0,0));
          f.push(...cyl(.04,.04,.04,s*.35,.15,0,8));
        }
        break;
      case 'propeller':
        f.push(...cyl(.05,.05,.08,0,0,-2,8));
        for(let i=0;i<3;i++){const a=(i/3)*Math.PI*2;f.push(...box(.02,.3,.08,Math.cos(a)*.15,Math.sin(a)*.15,-2));}
        break;
    }
    f.forEach(x=>{x.color=d.color;x.partKey=d.key;});
    parts.push({def:d,faces:f,offset:[0,0,0]});
  });
}

// ── 投影 ──
function project(p){
  let v=[p[0]-camera.pos[0],p[1]-camera.pos[1],p[2]-camera.pos[2]];
  const fwd=V.norm(V.sub(camera.target,camera.pos));
  const right=V.norm(V.cross(fwd,[0,1,0]));
  const up=V.cross(right,fwd);
  const cs=[V.dot(v,right),V.dot(v,up),V.dot(v,fwd)];
  if(cs[2]<=camera.near)return null;
  const fl=1/Math.tan(camera.fov*Math.PI/360);
  const asp=W/H;
  return[(cs[0]*fl/asp)/cs[2]*W/2+W/2,(1-cs[1]*fl/cs[2])*H/2,cs[2]];
}

// ── 着色 ──
function shade(c,l,h){
  let r,g,b;
  if(c.startsWith('rgb')){const m=c.match(/\d+/g);r=+m[0];g=+m[1];b=+m[2];}
  else{const hex=c.replace('#','');r=parseInt(hex.substr(0,2),16);g=parseInt(hex.substr(2,2),16);b=parseInt(hex.substr(4,2),16);}
  const i=.3+.7*Math.max(0,l);
  r=Math.min(255,r*i+(h?40:0));g=Math.min(255,g*i+(h?40:0));b=Math.min(255,b*i+(h?40:0));
  return`rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

// ── 渲染 ──
function render(){
  ctx.fillStyle='#0a0a0f';
  ctx.fillRect(0,0,W,H);
  
  // Grid
  for(let x=-10;x<=10;x++)for(let z=-10;z<=10;z++){
    const p1=project([x,-2,z]),p2=project([x+1,-2,z]),p3=project([x+1,-2,z+1]),p4=project([x,-2,z+1]);
    if(p1&&p2&&p3&&p4){ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.lineTo(p3[0],p3[1]);ctx.lineTo(p4[0],p4[1]);ctx.closePath();ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=.5;ctx.stroke();}
  }
  
  const allFaces=[];
  const light=V.norm([.5,.8,.3]);
  parts.forEach(part=>{
    const o=part.offset;
    part.faces.forEach(face=>{
      const tv=face.verts.map(v=>[v[0]+o[0],v[1]+o[1],v[2]+o[2]]);
      const e1=V.sub(tv[1],tv[0]),e2=V.sub(tv[2],tv[0]);
      const n=V.norm(V.cross(e1,e2));
      const vd=V.sub(camera.pos,tv[0]);
      if(!wireframe&&V.dot(n,vd)<0)return;
      const proj=tv.map(v=>project(v));
      if(proj.some(p=>!p))return;
      const avgZ=proj.reduce((s,p)=>s+p[2],0)/proj.length;
      allFaces.push({proj,color:face.color,partKey:face.partKey,z:avgZ,ld:V.dot(n,light),hl:face.highlight});
    });
  });
  allFaces.sort((a,b)=>b.z-a.z);
  allFaces.forEach(f=>{
    ctx.beginPath();
    ctx.moveTo(f.proj[0][0],f.proj[0][1]);
    for(let i=1;i<f.proj.length;i++)ctx.lineTo(f.proj[i][0],f.proj[i][1]);
    ctx.closePath();
    if(wireframe){ctx.strokeStyle=shade(f.color,f.ld,f.hl);ctx.lineWidth=1;ctx.stroke();}
    else{ctx.fillStyle=shade(f.color,f.ld,f.hl);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=.5;ctx.stroke();}
  });
}

// ── 相机 ──
function updateCamera(){
  camera.pos=[camera.target[0]+distance*Math.cos(elevation)*Math.sin(azimuth),
              camera.target[1]+distance*Math.sin(elevation),
              camera.target[2]+distance*Math.cos(elevation)*Math.cos(azimuth)];
}

// ── 动画 ──
function animate(){
  requestAnimationFrame(animate);
  time+=.016;
  if(autoRotate)azimuth+=.005;
  if(!exploded){
    const fa=Math.sin(time*2)*.3;
    const lw=parts.find(p=>p.def.key==='leftWing'),rw=parts.find(p=>p.def.key==='rightWing');
    if(lw)lw.offset=[0,fa*.5,fa];
    if(rw)rw.offset=[0,fa*.5,-fa];
  }
  updateCamera();
  render();
}

// ── 高亮 ──
function highlightPart(k){parts.forEach(p=>p.faces.forEach(f=>f.highlight=f.partKey===k));}
function clearHighlight(){parts.forEach(p=>p.faces.forEach(f=>f.highlight=false));}

// ── 爆炸图 ──
window.toggleExplode=function(){
  exploded=!exploded;
  document.getElementById('bExplode').classList.toggle('active',exploded);
  const dur=800,start=Date.now();
  const so=parts.map(p=>p.offset.slice());
  const to=parts.map(p=>exploded?p.def.explode:[0,0,0]);
  (function anim(){
    const t=Math.min((Date.now()-start)/dur,1);
    const e=1-Math.pow(1-t,3);
    parts.forEach((p,i)=>{p.offset=[so[i][0]+(to[i][0]-so[i][0])*e,so[i][1]+(to[i][1]-so[i][1])*e,so[i][2]+(to[i][2]-so[i][2])*e];});
    if(t<1)requestAnimationFrame(anim);
  })();
};

// ── 其他控制 ──
window.toggleRotate=function(){autoRotate=!autoRotate;document.getElementById('bRotate').classList.toggle('active',autoRotate);};
window.resetView=function(){azimuth=.6;elevation=.4;distance=10;updateCamera();};
window.toggleWire=function(){wireframe=!wireframe;document.getElementById('bWire').classList.toggle('active',wireframe);};

// ── UI 切换 ──
window.toggleUI=function(){
  const fu=document.getElementById('floatUi'),btn=document.getElementById('bToggle');
  fu.classList.toggle('hidden');
  if(fu.classList.contains('hidden')){btn.textContent='👁️‍🗨️';btn.title='显示面板';}
  else{btn.textContent='👁️';btn.title='隐藏面板';}
};

// ── 鼠标交互 ──
function onMouseMove(e){
  mouse.x=e.clientX;mouse.y=e.clientY;
  if(mouse.down){
    const dx=e.clientX-mouse.lastX,dy=e.clientY-mouse.lastY;
    if(mouse.button===0){azimuth-=.01*dx;elevation=Math.max(-1.2,Math.min(1.2,elevation+.01*dy));}
    else if(mouse.button===2){
      const r=V.norm(V.norm(V.sub(camera.target,camera.pos)),[0,1,0]);
      camera.target=V.add(camera.target,V.scale(r,-.01*dx*.01*distance));
      camera.target=V.add(camera.target,[0,.01*dy*.01*distance,0]);
    }
    mouse.lastX=e.clientX;mouse.lastY=e.clientY;updateCamera();
  }
  let closest=null,cd=30;
  parts.forEach(p=>{
    const c=[p.offset[0],p.offset[1]+.5,p.offset[2]];
    const pr=project(c);
    if(pr){const d=Math.sqrt((pr[0]-mouse.x)**2+(pr[1]-mouse.y)**2);if(d<cd){cd=d;closest=p.def.key;}}
  });
  if(closest!==hoveredPart){hoveredPart=closest;highlightPart(closest);}
}

function onMouseDown(e){mouse.down=true;mouse.button=e.button;mouse.lastX=e.clientX;mouse.lastY=e.clientY;e.preventDefault();}
function onMouseUp(){mouse.down=false;}
function onWheel(e){distance=Math.max(3,Math.min(20,distance+e.deltaY*.01));updateCamera();e.preventDefault();}
function onContext(e){e.preventDefault();}

// ── 初始化 ──
function init(){
  canvas=document.getElementById('c');
  ctx=canvas.getContext('2d');
  resize();
  window.addEventListener('resize',resize);
  buildModel();
  const pl=document.getElementById('parts');
  PART_DEFS.forEach(d=>{
    const item=document.createElement('div');
    item.className='part-item';
    item.innerHTML=`<div class="part-color" style="background:${d.color}"></div><span>${d.name}</span>`;
    item.addEventListener('mouseenter',()=>highlightPart(d.key));
    item.addEventListener('mouseleave',()=>clearHighlight());
    pl.appendChild(item);
  });
  canvas.addEventListener('mousemove',onMouseMove);
  canvas.addEventListener('mousedown',onMouseDown);
  canvas.addEventListener('mouseup',onMouseUp);
  canvas.addEventListener('wheel',onWheel,{passive:false});
  canvas.addEventListener('contextmenu',onContext);
  updateCamera();
  animate();
  // 隐藏 loading
  const l=document.getElementById('loading');
  if(l)l.classList.add('fade-out');
}

function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;}

// ── 启动 ──
try{init();}catch(e){
  console.error('Init failed:',e);
  const l=document.getElementById('loading');
  if(l){l.innerHTML='<div style="color:#ff6b6b">⚠️ 初始化失败: '+(e.message||'未知错误')+'</div><button onclick="location.reload()" style="margin-top:12px;padding:6px 16px;background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.3);border-radius:20px;color:#00d4ff;cursor:pointer">刷新重试</button>';}
}
// 保底：3秒后强制隐藏 loading
setTimeout(()=>{const l=document.getElementById('loading');if(l)l.classList.add('fade-out');},3000);

})();
</script>
</body>
